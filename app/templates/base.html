<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="{% block description %}A modern web application built with FastAPI, HTMX, and Pico CSS{% endblock %}">
    <meta name="keywords" content="{% block keywords %}fastapi, web app, python{% endblock %}">
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{% block og_title %}FastAPI App{% endblock %}">
    <meta property="og:description" content="{% block og_description %}A modern web application{% endblock %}">
    <meta property="og:site_name" content="FastAPI App">
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:title" content="{% block twitter_title %}FastAPI App{% endblock %}">
    <meta property="twitter:description" content="{% block twitter_description %}A modern web application{% endblock %}">
    
    <title>{% block title %}FastAPI App{% endblock %}</title>
    
    <!-- Pico CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Minimal custom styles -->
    <style>
        /* Theme toggle button - legitimately custom */
        .theme-toggle {
            position: fixed;
            bottom: 1rem;
            right: 1rem;
            width: 3rem;
            height: 3rem;
            border-radius: 50%;
            cursor: pointer;
            z-index: 100;
        }
    </style>
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Header with Navigation -->
    <header class="container">
        <nav>
            <ul>
                <li><strong><a href="/">🚀 FastAPI App</a></strong></li>
            </ul>
            <ul>
                {% if user %}
                    <li><a href="/dashboard" title="Dashboard">📊</a></li>
                    <li><a href="/items" title="My Items">📝</a></li>
                    <li><a href="/profile" title="Settings">⚙️</a></li>
                    <li>
                        <form action="/logout" method="post" style="margin: 0;">
                            <button type="submit" class="outline" style="padding: 0.5rem 1rem;">Logout</button>
                        </form>
                    </li>
                {% else %}
                    <li>
                        <a href="/login" class="outline" role="button">Sign In</a>
                    </li>
                {% endif %}
            </ul>
        </nav>
    </header>
    
    <!-- Main content -->
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    
    <!-- Footer -->
    <footer class="container">
        <small>
            © {{ current_year() }} Your App Name • Built with 
            <a href="https://fastapi.tiangolo.com/" target="_blank">FastAPI</a>, 
            <a href="https://picocss.com/" target="_blank">Pico CSS</a> & 
            <a href="https://htmx.org/" target="_blank">HTMX</a>
        </small>
    </footer>
    
    <!-- Theme Toggle Button -->
    <button class="theme-toggle" 
            onclick="toggleTheme()" 
            aria-label="Toggle theme"
            data-tooltip="Toggle theme"
            data-placement="left">
        <span id="theme-icon">🌙</span>
    </button>
    
    <script>
        // Theme toggle functionality
        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            const icon = document.getElementById('theme-icon');
            
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            icon.textContent = newTheme === 'light' ? '🌙' : '☀️';
        }
        
        // Load saved theme preference
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            const icon = document.getElementById('theme-icon');
            
            document.documentElement.setAttribute('data-theme', savedTheme);
            icon.textContent = savedTheme === 'light' ? '🌙' : '☀️';
        });
    </script>
    
    {% block extra_scripts %}{% endblock %}
</body>
</html>
